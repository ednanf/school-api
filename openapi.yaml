openapi: 3.0.3
info:
  title: School Management API
  description: |
    A RESTful API for managing school operations including students, teachers, classes, subjects, staff, departments, and authentication.
    
    ## Base URL
    All endpoints are prefixed with `/api/v1`
    
    ## Authentication
    Most endpoints require JWT authentication via Bearer token. Include the token in the Authorization header:
    ```
    Authorization: Bearer <your_jwt_token>
    ```
    
    ## Response Format
    All responses follow a standard envelope format:
    - Success responses: `{"status": "success", "message"?: "...", "data"?: {...}, "meta"?: {...}}`
    - Error responses: `{"status": "error", "message": "...", "details"?: {...}}`
    
    ## Pagination
    List endpoints support pagination via query parameters `page` and `limit`. Paginated responses include `meta` with page, limit, count, total_items, and total_pages.
    
    ## Validation
    Validation errors return HTTP 422 with field-level details in the `details` field.
    
    ## Rate Limiting
    Sensitive auth endpoints (login, forgot-password, reset-password, activate) are rate-limited by IP address.
  version: 1.0.0
  contact:
    name: API Support
  license:
    name: License
    url: https://github.com/ednanf/school-api/blob/main/LICENSE

tags:
  - name: Auth
    description: Authentication and user account management
  - name: Users
    description: User management (admin only)
  - name: Students
    description: Student records and management
  - name: Classes
    description: Class/cohort management
  - name: Subjects
    description: Academic subjects management
  - name: Teachers
    description: Teacher records and management
  - name: Teacher Assignments
    description: Teacher-subject-class assignment mappings
  - name: Departments
    description: Department management
  - name: Staff Positions
    description: Staff position/job title management
  - name: Staff
    description: Staff member records and management

servers:
  - url: /api/v1
    description: API Version 1

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token obtained from login endpoint

  schemas:
    ErrorResponse:
      type: object
      required:
        - status
        - message
      properties:
        status:
          type: string
          enum: [error]
          example: error
        message:
          type: string
          example: Error message
        details:
          type: object
          nullable: true
          example: {"field": "validation error"}

    SuccessResponse:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum: [success]
          example: success
        message:
          type: string
          nullable: true
          example: Operation successful
        data:
          type: object
          nullable: true
        meta:
          $ref: '#/components/schemas/PaginatedMeta'
          nullable: true

    PaginatedMeta:
      type: object
      required:
        - page
        - limit
        - count
        - total_items
        - total_pages
      properties:
        page:
          type: integer
          format: int32
          minimum: 1
          example: 1
        limit:
          type: integer
          format: int32
          minimum: 1
          example: 10
        count:
          type: integer
          format: int32
          description: Number of items returned in current page
          example: 5
        total_items:
          type: integer
          format: int32
          description: Total number of items across all pages
          example: 50
        total_pages:
          type: integer
          format: int32
          description: Total number of pages
          example: 5

    PaginatedResponse:
      type: object
      required:
        - status
        - data
        - meta
      properties:
        status:
          type: string
          enum: [success]
          example: success
        data:
          type: array
          items:
            type: object
        meta:
          $ref: '#/components/schemas/PaginatedMeta'

    BulkMeta:
      type: object
      required:
        - count
        - total
      properties:
        count:
          type: integer
          format: int64
          description: Number of items affected
          example: 3
        total:
          type: integer
          format: int64
          description: Total number of items in request
          example: 3

    BulkResult:
      type: object
      required:
        - items
        - meta
      properties:
        items:
          type: array
          items:
            type: object
        meta:
          $ref: '#/components/schemas/BulkMeta'

    # Auth schemas
    LoginInput:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          minLength: 1
          example: admin@school.edu
        password:
          type: string
          minLength: 1
          example: password123

    LoginResponse:
      type: object
      required:
        - token
        - user
      properties:
        token:
          type: string
          description: JWT bearer token
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        user:
          $ref: '#/components/schemas/UserResponse'

    ChangePasswordInput:
      type: object
      required:
        - current_password
        - new_password
      properties:
        current_password:
          type: string
          minLength: 1
          example: oldpassword123
        new_password:
          type: string
          minLength: 8
          example: newpassword123

    ForgotPasswordInput:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
          minLength: 1
          example: user@school.edu

    ResetPasswordInput:
      type: object
      required:
        - token
        - new_password
      properties:
        token:
          type: string
          minLength: 1
          example: reset-token-uuid
        new_password:
          type: string
          minLength: 8
          example: newpassword123

    ActivateAccountRequest:
      type: object
      required:
        - token
      properties:
        token:
          type: string
          minLength: 1
          example: activation-token

    # User schemas
    UserRole:
      type: string
      enum: [super_admin, admin, staff]
      example: admin

    User:
      type: object
      required:
        - id
        - username
        - email
        - role
        - is_active
        - created_at
        - updated_at
      properties:
        id:
          type: integer
          format: int32
          example: 1
        staff_id:
          type: integer
          format: int32
          nullable: true
          example: 100
        username:
          type: string
          minLength: 3
          maxLength: 50
          example: johndoe
        email:
          type: string
          format: email
          example: john@school.edu
        password_hash:
          type: string
          writeOnly: true
        role:
          $ref: '#/components/schemas/UserRole'
        is_active:
          type: boolean
          example: true
        last_login_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    UserResponse:
      type: object
      required:
        - id
        - username
        - email
        - role
        - is_active
      properties:
        id:
          type: integer
          format: int32
          example: 1
        staff_id:
          type: integer
          format: int32
          nullable: true
          example: 100
        username:
          type: string
          example: johndoe
        email:
          type: string
          format: email
          example: john@school.edu
        role:
          $ref: '#/components/schemas/UserRole'
        is_active:
          type: boolean
          example: true

    CreateUserInput:
      type: object
      required:
        - username
        - email
        - password
        - role
      properties:
        staff_id:
          type: integer
          format: int32
          nullable: true
          minimum: 1
          example: 100
        username:
          type: string
          minLength: 3
          maxLength: 50
          example: johndoe
        email:
          type: string
          format: email
          example: john@school.edu
        password:
          type: string
          minLength: 8
          example: password123
        role:
          $ref: '#/components/schemas/UserRole'

    PatchUserInput:
      type: object
      properties:
        staff_id:
          type: integer
          format: int32
          nullable: true
          minimum: 1
          example: 100
        username:
          type: string
          minLength: 3
          maxLength: 50
          example: johndoe
        email:
          type: string
          format: email
          example: john@school.edu
        role:
          $ref: '#/components/schemas/UserRole'
        is_active:
          type: boolean
          example: true

    # Student schemas
    ClassSummary:
      type: object
      required:
        - id
        - grade
        - letter
      properties:
        id:
          type: integer
          format: int32
          example: 1
        grade:
          type: integer
          format: int32
          minimum: 1
          maximum: 9
          example: 5
        letter:
          type: string
          enum: [A, B, C, D]
          example: A

    Student:
