          type: integer
          format: int32
          example: 100
        first_name:
          type: string
          example: John
        last_name:
          type: string
          example: Smith
        email:
          type: string
          format: email
          example: john.smith@school.edu
        class:
          $ref: '#/components/schemas/ClassSummary'
        is_active:
          type: boolean
          example: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateStudentInput:
      type: object
      required:
        - first_name
        - last_name
        - email
        - class_id
        - is_active
      properties:
