        email:
          type: string
          format: email
          example: john.smith@school.edu
        class_id:
          type: integer
          format: int32
          minimum: 1
          example: 1
        is_active:
          type: boolean
          example: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    PopulatedStudent:
      type: object
