          format: int32
          example: 1
        name:
          type: string
          minLength: 1
          maxLength: 50
          example: Mathematics
        is_active:
          type: boolean
          example: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateSubjectInput:
      type: object
      required:
        - name
        - is_active
      properties:
